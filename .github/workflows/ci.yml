name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pdfplumber pymupdf pytesseract pydantic pydantic-settings sqlalchemy aiosqlite httpx pytest google-genai boto3

    - name: Verify Starter Bundle Checksums
      run: python scripts/verify_checksums.py

    - name: Run Resolver & Golden Policy Tests
      run: python -m pytest backend/tests/golden/ -v

    - name: Run API Integration Tests
      run: python -m pytest backend/tests/integration/ -v

    - name: Build Frontend Assets
      run: |
        cd frontend
        npm ci
        npm run build
